[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "apple-music-source"
version = "0.1.0"
description = "Source Apple Music crypto and authentication helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WorldObservationLog" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]
