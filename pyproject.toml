[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
description = "Apple Music ALAC/AAC SAMPLE-AES decryption HTTP service"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "m3u8>=3.0",
    "temari",
]

[project.scripts]
orchestrator-server = "server:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["server"]
